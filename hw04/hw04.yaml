# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw04-deployment
  labels:
    app: hw04-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hw04-app
  template:
    metadata:
      labels:
        app: hw04-app
    spec:
      containers:
        - name: hw04-app
          image: a1exander78/hw04:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: hw04-service
  labels:
    app: hw04-app
spec:
  selector:
    app: hw04-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
#Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hw04-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hw04-service
                port:
                  number: 80