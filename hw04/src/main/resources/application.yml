spring:
  datasource:
    url: jdbc:h2:mem:maindb
    driverClassName: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    jdbc:
      dialect: h2

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql


server:
  port: ${APP_PORT:8000}